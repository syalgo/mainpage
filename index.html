<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>세영로보틱스 코딩학원 메인페이지</title>
  <style>
    :root{
      --bg:#0b1220;
      --card:#121b2f;
      --text:#e9eefc;
      --muted:#a9b3d1;
      --line:rgba(255,255,255,.08);
      --radius:16px;
    }

    *{box-sizing:border-box}

    html, body{height:100%;}

    body{
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", Arial, sans-serif;
      background: var(--bg);
      color:var(--text);
      min-height:100vh;
      overflow-x:hidden;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      z-index:-1;
      background:
        radial-gradient(1200px 600px at 10% 0%, rgba(80,120,255,.18), transparent 60%),
        radial-gradient(900px 500px at 100% 10%, rgba(0,220,180,.12), transparent 55%),
        linear-gradient(180deg, rgba(255,255,255,.04), transparent 40%),
        var(--bg);
    }

    .wrap{
      max-width:1200px;
      margin:0 auto;
      padding:16px 22px 40px;
    }

    header{
      display:flex;
      gap:14px;
      align-items:flex-start;
      justify-content:space-between;
      padding:22px 22px;
      border:1px solid var(--line);
      border-radius:var(--radius);
      background: rgba(18,27,47,.55);
      backdrop-filter: blur(8px);
    }

    .title h1{
      margin:0;
      font-size:24px;
      letter-spacing:-0.2px;
    }

    .title p{
      margin:8px 0 0;
      color:var(--muted);
      font-size:13px;
      line-height:1.4;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:9px 12px;
      border:1px solid var(--line);
      border-radius:999px;
      color:var(--muted);
      font-size:12px;
      white-space:nowrap;
      background: rgba(255,255,255,.03);
    }

    .grid{
      margin-top:18px;
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap:14px;
    }

    .card{
      grid-column: span 12;
      text-decoration:none;
      color:inherit;
      border:1px solid var(--line);
      background: rgba(18,27,47,.6);
      border-radius:var(--radius);
      padding:18px 18px;
      transition: transform .08s ease, border-color .08s ease;
      min-height:100px;
    }

    .card:hover{
      transform: translateY(-2px);
      border-color: rgba(255,255,255,.18);
    }

    .card h2{
      margin:0;
      font-size:18px;
    }

    .card p{
      margin:10px 0 0;
      color:var(--muted);
      font-size:13px;
      line-height:1.45;
    }

    .topic-grid{
      grid-column: span 12;
      display:grid;
      grid-template-columns: repeat(5, 1fr);
      gap:14px;
    }

    .topic-card{
      min-height:78px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:14px 10px;
      border:1px solid var(--line);
      background: rgba(18,27,47,.6);
      border-radius:var(--radius);
      color:var(--text);
      font-size:15px;
      font-weight:700;
      line-height:1.35;
      text-decoration:none;
      transition: transform .08s ease, border-color .08s ease, background .08s ease;
    }

    .topic-card:hover{
      transform: translateY(-2px);
      border-color: rgba(255,255,255,.18);
      background: rgba(24,36,62,.75);
    }

    @media (max-width: 900px){
      .topic-grid{
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 520px){
      .wrap{
        padding:14px 14px 32px;
      }

      header{
        flex-direction:column;
        align-items:flex-start;
      }

      .badge{
        align-self:flex-start;
      }

      .topic-grid{
        grid-template-columns: 1fr;
      }
    }

    footer{
      margin-top:16px;
      color:var(--muted);
      font-size:12px;
      opacity:.9;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div class="title">
        <h1>세영 로보틱스 코딩학원 :)</h1>
        <p>동탄대로시범길 148-20, 마추프라자 507호&nbsp;&nbsp;&nbsp;010 - 9913 - 3072</p>
      </div>
      <div class="badge" id="now">⏱️ 로딩 중…</div>
    </header>

    <section class="grid">
      <a class="card" href="https://syalgo.github.io/timetable/" target="_blank" rel="noopener">
        <h2>정보올림피아드 타임테이블</h2>
        <p>수업 시작/종료 알림 포함 페이지로 이동</p>
      </a>

      <div class="topic-grid">
        <a class="topic-card" href="https://syalgo.github.io/lec1" target="_blank" rel="noopener">경우의 수</a>
        <a class="topic-card" href="https://syalgo.github.io/lec2" target="_blank" rel="noopener">그래프이론</a>
        <a class="topic-card" href="https://syalgo.github.io/lec3" target="_blank" rel="noopener">논리 및 게임정리</a>
        <a class="topic-card" href="https://syalgo.github.io/lec4" target="_blank" rel="noopener">논리와 불대수</a>
        <a class="topic-card" href="https://syalgo.github.io/lec5" target="_blank" rel="noopener">수학규칙과 알고리즘1</a>

        <a class="topic-card" href="https://syalgo.github.io/lec6" target="_blank" rel="noopener">수학규칙과 알고리즘2</a>
        <a class="topic-card" href="https://syalgo.github.io/lec7" target="_blank" rel="noopener">알고리즘과 자료구조</a>
        <a class="topic-card" href="https://syalgo.github.io/lec8" target="_blank" rel="noopener">정수론</a>
        <a class="topic-card" href="https://syalgo.github.io/lec9" target="_blank" rel="noopener">조합론</a>
        <a class="topic-card" href="https://syalgo.github.io/lec10" target="_blank" rel="noopener">집합과 관계정리</a>
      </div>
    </section>

    <footer>
      <div> :0</div>
    </footer>
  </div>

  <script>
    function tick(){
      const d = new Date();

      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');

      const week = ["일","월","화","수","목","금","토"][d.getDay()];

      const hh = String(d.getHours()).padStart(2,'0');
      const mm = String(d.getMinutes()).padStart(2,'0');

      document.getElementById('now').textContent = `🗓️ ${y}-${m}-${day} (${week})  ${hh}:${mm}`;
    }

    tick();
    setInterval(tick, 1000 * 30);
  </script>
</body>
</html>
